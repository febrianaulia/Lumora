name: Build Windows Installer
on:
  push:
    branches:
      - windows-installer-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows x64 NSIS installer
        run: npm run dist:win -- --x64
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumora-windows-x64-v2.7.1
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Attach installer to the Lumora v2.7.1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.1
          files: dist/*.exe
          fail_on_unmatched_files: true
